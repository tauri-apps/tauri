[advisories]
ignore = [
  # rsa Marvin Attack
  "RUSTSEC-2023-0071",
  # difference is unmaintained
  "RUSTSEC-2020-0095",
  # proc-macro-error is unmaintained
  "RUSTSEC-2024-0370",
  # rand unsoundness, fixed when we remove kuchikiki from deps in v3, currently
  # remains for semver reasons but is not built in default configuration
  "RUSTSEC-2026-0097",
  # This ruzstd vulnerability is denial of service only used in CLI for devs,
  # the fix requires an upstream update in https://github.com/indygreg/apple-platform-rs/pull/342
  "RUSTSEC-2026-0344",
  # glib 0.18.5 unsoundness, fixed by updating to gtk4
  "RUSTSEC-2024-0429",
  # ml-dsa timing side-channel, only reachable when signing RPMs with a post-quantum ML-DSA key locally,
  # pulled in by rpm (enables pgp's draft-pqc feature); no pgp release uses a patched ml-dsa yet
  "RUSTSEC-2025-0144",
  # crypto-bigint timing side-channels, only reachable when signing RPMs locally with a
  # TAURI_SIGNING_RPM_KEY elliptic curve key, pulled in by rpm through sequoia-openpgp;
  # the fix requires crypto-bigint 0.7 but no RustCrypto elliptic curve 0.13 release supports it
  "RUSTSEC-2026-0387",
]
