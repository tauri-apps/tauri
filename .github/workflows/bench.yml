name: bench

on:
  push:
    branches:
      - dev
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/bench.yml'
      - 'bench/**'

env:
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0 # This would add unnecessary bloat to the target folder, decreasing cache efficiency.
  LC_ALL: en_US.UTF-8 # This prevents strace from changing its number format to use commas.
  # Pinned so a new compiler does not show up as a binary size or performance change of a Tauri commit.
  # Bump it deliberately, in a pull request of its own.
  BENCH_TOOLCHAIN: nightly-2026-11-25

# Every commit on dev gets its own data point: a run is never cancelled or replaced by a newer push,
# otherwise a regression can only be narrowed down to a range of commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {
              target: x86_64-unknown-linux-gnu,
              os: ubuntu-latest,
              runner: 'xvfb-run --auto-servernum ',
              # valgrind only runs on Linux
              args: ' --instructions'
            }
          - {
              target: x86_64-pc-windows-msvc,
              os: windows-latest,
              runner: '',
              ext: '.exe'
            }
          - { target: aarch64-apple-darwin, os: macos-latest, runner: '' }

    runs-on: ${{ matrix.platform.os }}
    # the apps, the clean builds that are timed and the CLI that bundles the installers
    # are all built without a cache
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v6

      - name: install Rust ${{ env.BENCH_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.BENCH_TOOLCHAIN }}
          components: rust-src
          targets: ${{ matrix.platform.target }}

      - name: install webkit2gtk, xvfb, strace and valgrind (ubuntu only)
        if: contains(matrix.platform.target, 'gnu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            webkit2gtk-4.1 libayatana-appindicator3-dev \
            xvfb \
            at-spi2-core \
            strace valgrind

      # No rust-cache on purpose: this job only runs on `dev`, its target dir does not fit the
      # repository's 10 GB cache limit next to the entries pull requests restore, and an entry
      # evicted before the next push only costs upload time.

      # built first: the regular build below overwrites the binary
      - name: build hello world without the default features of tauri
        shell: bash
        env:
          RUSTFLAGS: '-Zunstable-options -Cpanic=immediate-abort'
        run: |
          cargo +${{ env.BENCH_TOOLCHAIN }} build --release \
            -Z build-std=std,panic_abort -Z build-std-features= \
            --target ${{ matrix.platform.target }} \
            -p bench_helloworld --no-default-features
          cd target/${{ matrix.platform.target }}/release
          cp bench_helloworld${{ matrix.platform.ext }} bench_helloworld_minimal${{ matrix.platform.ext }}

      - name: build benchmark binaries
        env:
          RUSTFLAGS: '-Zunstable-options -Cpanic=immediate-abort'
        run: >
          cargo +${{ env.BENCH_TOOLCHAIN }} build --release
          -Z build-std=std,panic_abort -Z build-std-features=
          --target ${{ matrix.platform.target }}
          -p bench_helloworld -p bench_cpu_intensive -p bench_ipc -p bench_assets

      - name: run benchmarks
        run: ${{ matrix.platform.runner }}cargo run --manifest-path ./bench/Cargo.toml --bin run_benchmark -- --build-time --bundle${{ matrix.platform.args }}

      - name: clone benchmarks_results
        if: github.repository == 'tauri-apps/tauri' && github.ref == 'refs/heads/dev'
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.ORG_TAURI_BOT_PAT }}
          path: gh-pages
          repository: tauri-apps/benchmark_results

      - name: push new benchmarks
        if: github.repository == 'tauri-apps/tauri' && github.ref == 'refs/heads/dev'
        shell: bash
        run: |
          cargo run --manifest-path ./bench/Cargo.toml --bin build_benchmark_jsons

          cd gh-pages

          git config user.name "tauri-bot"
          git config user.email "tauri-bot@tauri.app"
          git config pull.rebase merges

          git add .
          git commit --message "Update Tauri benchmarks"

          # Retry 3 times in case we're colliding with other CI runs
          for _ in {1..3}; do
            git pull || exit $?
            git push origin gh-pages && break
          done
