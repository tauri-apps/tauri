name: Rust Build & Test

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          profile: minimal
          override: true

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build the bundler crate
        run: cargo build --manifest-path crates/tauri-bundler/Cargo.toml --verbose

      - name: Run tests for bundler crate
        run: cargo test --manifest-path crates/tauri-bundler/Cargo.toml --verbose
  
  test-no-sign-feature:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Corrected package name for Ubuntu 24.04
          sudo apt-get install -y libwebkit2gtk-4.1-dev libudev-dev
          
      - name: Build with --no-sign flag
        run: |
          cargo build --release --manifest-path crates/tauri-cli/Cargo.toml

          if [ "${{ runner.os }}" == "macOS" ]; then
            TARGET_TRIPLE="x86_64-apple-darwin"
          elif [ "${{ runner.os }}" == "Windows" ]; then
            TARGET_TRIPLE="x86_64-pc-windows-msvc"
          else
            TARGET_TRIPLE="x86_64-unknown-linux-gnu"
          fi
          
          # Use a real path to a dummy project
          cargo run --release --package tauri-cli -- build --no-sign --target $TARGET_TRIPLE > build_output.log 2>&1
        working-directory: test-project/

      - name: Verify that signing was skipped
        run: |
          # Use grep on all platforms
          grep -q "Skipping signing" build_output.log
