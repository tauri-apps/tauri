name: check change tags

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: check change files end with .md
        run: |
          for file in .changes/*
          do
            if [[ ! "$file" =~ \.(md|json)$ ]]; then
              echo ".changes directory should only contain files that end with .md"
              echo "found an invalid file in .changes directory:"
              echo "$file"
              exit 1
            fi
          done

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          list-files: shell
          filters: |
            changes:
              - added|modified: '.changes/*.md'

      - name: check
        run: node ./.scripts/ci/check-change-tags.js ${{ steps.filter.outputs.changes_files }}
        if: ${{ steps.filter.outputs.changes == 'true' }}

  check-missing-bumps:
    runs-on: ubuntu-latest
    # add this label to PRs that change packages without needing a release (docs, refactors, CI)
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip change file') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: check changed packages have a change file
        run: node ./.scripts/ci/check-change-tags.js --missing-bumps origin/${{ github.base_ref }}
