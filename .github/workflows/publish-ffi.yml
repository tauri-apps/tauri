# Builds the tauri-ffi cdylib for every supported (runtime × target) once, then
# fans out to all distribution channels from the same artifacts. Each runtime
# (wry today; cef is added on feat/cef) produces its own library — libtauri_wry,
# libtauri_cef, … — while the exported C ABI (tauri_ffi.h) is identical, so the
# runtimes are distributed side by side:
#   - C archives (header + library) attached to a GitHub release
#   - npm: @tauri-apps/node(-<runtime>) base + per-(runtime,platform) packages
#   - PyPI: tauri-ffi platform wheels (cffi ABI mode, library bundled)
#   - JSR: @tauri-apps/deno (library downloaded from the GitHub release at runtime)
#
# Adding a runtime = add it to the `runtime` matrices below and to RUNTIMES in
# bindings/scripts/targets.mjs; the build recipe is `--features runtime-<name>`.

name: publish tauri-ffi
env:
  MACOSX_DEPLOYMENT_TARGET: '10.13'
  TAURI_FFI_TARGETS: >-
    x86_64-apple-darwin aarch64-apple-darwin
    x86_64-pc-windows-msvc aarch64-pc-windows-msvc
    x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'version for all packages (e.g. 0.1.0)'
        required: true
      releaseTag:
        description: 'existing GitHub release tag for the C archives (e.g. tauri-ffi-v0.1.0); leave empty to skip'
        required: false
        default: ''
      dryRun:
        description: 'stage everything but do not publish or upload'
        type: boolean
        default: true

permissions:
  contents: write # upload release assets
  id-token: write # OIDC trusted publishing (npm, PyPI, JSR)

jobs:
  # Fail fast on a stale manifest/bindings state before burning builders.
  check-generated:
    name: generated bindings are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node bindings/bindgen/generate.mjs --check

  build:
    name: build ${{ matrix.runtime }} ${{ matrix.settings.target }}
    needs: check-generated
    strategy:
      fail-fast: false
      matrix:
        # cef is added on feat/cef (it may also need target-specific `include`
        # entries for its extra system deps / framework download).
        runtime: [wry]
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v7

      - name: install linux system dependencies
        if: ${{ contains(matrix.settings.target, 'linux') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ffi-${{ matrix.runtime }}-${{ matrix.settings.target }}

      - name: build
        run: cargo build -p tauri-ffi --release --target ${{ matrix.settings.target }} --no-default-features --features runtime-${{ matrix.runtime }}

      # cargo emits the crate's own name (tauri_ffi); stage it under the runtime's
      # distribution name (tauri_<runtime>) — that is what dist.mjs and the
      # language loaders expect for a published library.
      - name: stage artifact
        shell: bash
        run: |
          mkdir -p dist-lib
          t='${{ matrix.settings.target }}'
          r='${{ matrix.runtime }}'
          case "$t" in
            *windows*)
              cp "target/$t/release/tauri_ffi.dll"     "dist-lib/tauri_$r.dll"
              cp "target/$t/release/tauri_ffi.dll.lib" "dist-lib/tauri_$r.dll.lib" ;;
            *apple*)
              cp "target/$t/release/libtauri_ffi.dylib" "dist-lib/libtauri_$r.dylib" ;;
            *)
              cp "target/$t/release/libtauri_ffi.so"    "dist-lib/libtauri_$r.so" ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: lib-${{ matrix.runtime }}-${{ matrix.settings.target }}
          path: dist-lib/*
          if-no-files-found: error

  smoke:
    name: smoke ${{ matrix.runtime }} ${{ matrix.settings.target }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runtime: [wry]
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v7
      - name: install linux runtime dependencies
        if: ${{ contains(matrix.settings.target, 'linux') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y webkit2gtk-4.1 libxdo-dev
      - run: npm i -g --force corepack
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
      - uses: actions/download-artifact@v8
        with:
          name: lib-${{ matrix.runtime }}-${{ matrix.settings.target }}
          path: artifact
      - name: install koffi
        run: pnpm install --frozen-lockfile --filter @tauri-apps/node
      - name: run smoke test
        shell: bash
        run: |
          t='${{ matrix.settings.target }}'
          r='${{ matrix.runtime }}'
          case "$t" in
            *windows*) lib="artifact/tauri_$r.dll" ;;
            *apple*)   lib="artifact/libtauri_$r.dylib" ;;
            *)         lib="artifact/libtauri_$r.so" ;;
          esac
          TAURI_FFI_LIB="$PWD/$lib" node bindings/scripts/smoke.mjs

  dist-c:
    name: C release archives (${{ matrix.runtime }})
    needs: [build, smoke]
    strategy:
      fail-fast: false
      matrix:
        runtime: [wry]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          pattern: lib-${{ matrix.runtime }}-*
          path: artifacts
      - name: stage archives
        run: node bindings/scripts/dist.mjs c --version ${{ inputs.version }} --runtime ${{ matrix.runtime }} --artifacts artifacts --out dist --require-all
      - uses: actions/upload-artifact@v7
        with:
          name: c-dist-${{ matrix.runtime }}
          path: dist/*
      # Per-runtime asset names (incl. SHA256SUMS-<runtime>) never clobber across runtimes.
      - name: upload to GitHub release
        if: ${{ !inputs.dryRun && inputs.releaseTag != '' }}
        run: gh release upload '${{ inputs.releaseTag }}' dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  publish-npm:
    name: publish npm packages (${{ matrix.runtime }})
    needs: [build, smoke]
    strategy:
      fail-fast: false
      matrix:
        runtime: [wry]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npm i -g --force corepack
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v8
        with:
          pattern: lib-${{ matrix.runtime }}-*
          path: artifacts
      - name: stage packages
        run: node bindings/scripts/dist.mjs npm --version ${{ inputs.version }} --runtime ${{ matrix.runtime }} --artifacts artifacts --out dist --require-all
      - name: pack (dry run)
        if: ${{ inputs.dryRun }}
        run: |
          for dir in dist/npm/*/; do (cd "$dir" && pnpm pack); done
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.dryRun }}
        with:
          name: npm-dist-${{ matrix.runtime }}
          path: dist/npm/*/*.tgz
      - name: publish
        if: ${{ !inputs.dryRun }}
        run: |
          # platform packages first so the base's optionalDependencies resolve
          for dir in dist/npm/platform-*/; do
            (cd "$dir" && pnpm publish --provenance --access public --no-git-checks)
          done
          for dir in dist/npm/base-*/; do
            (cd "$dir" && pnpm publish --provenance --access public --no-git-checks)
          done
        env:
          NODE_AUTH_TOKEN: '' # OIDC trusted publishing

  publish-pypi:
    name: publish PyPI wheels (${{ matrix.runtime }})
    needs: [build, smoke]
    strategy:
      fail-fast: false
      matrix:
        # NOTE: every runtime currently builds the same `tauri_ffi` package; a
        # non-default runtime needs its own package name (decided on feat/cef)
        # to coexist on PyPI.
        runtime: [wry]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: lib-${{ matrix.runtime }}-*
          path: artifacts
      - name: build platform wheels
        shell: bash
        run: |
          r='${{ matrix.runtime }}'
          python -m pip install --quiet setuptools wheel
          declare -A TAGS=(
            [x86_64-apple-darwin]=macosx_10_13_x86_64
            [aarch64-apple-darwin]=macosx_11_0_arm64
            [x86_64-pc-windows-msvc]=win_amd64
            [aarch64-pc-windows-msvc]=win_arm64
            [x86_64-unknown-linux-gnu]=manylinux_2_39_x86_64
            [aarch64-unknown-linux-gnu]=manylinux_2_39_aarch64
          )
          lib_name() {
            case "$1" in
              *windows*) echo "tauri_$r.dll" ;;
              *apple*)   echo "libtauri_$r.dylib" ;;
              *)         echo "libtauri_$r.so" ;;
            esac
          }
          cd bindings/python
          for target in $TAURI_FFI_TARGETS; do
            lib="$(lib_name "$target")"
            mkdir -p tauri_ffi/_native
            cp "$GITHUB_WORKSPACE/artifacts/lib-$r-$target/$lib" tauri_ffi/_native/
            TAURI_FFI_VERSION='${{ inputs.version }}' python setup.py bdist_wheel --plat-name "${TAGS[$target]}"
            rm -rf tauri_ffi/_native build
          done
          ls -l dist/
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.dryRun }}
        with:
          name: pypi-dist-${{ matrix.runtime }}
          path: bindings/python/dist/*.whl
      - name: publish
        if: ${{ !inputs.dryRun }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: bindings/python/dist

  publish-jsr:
    name: publish JSR package
    needs: [build, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: stamp version
        run: |
          node -e "
            const fs = require('fs')
            const file = 'bindings/deno/deno.json'
            const config = JSON.parse(fs.readFileSync(file, 'utf8'))
            config.version = '${{ inputs.version }}'
            fs.writeFileSync(file, JSON.stringify(config, null, 2) + '\n')
          "
      - name: publish
        working-directory: bindings/deno
        run: deno publish --allow-dirty ${{ inputs.dryRun && '--dry-run' || '' }}
