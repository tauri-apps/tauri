name: test `@tauri-apps/api` e2e

on:
  workflow_dispatch:
  push:
    branches:
      - dev
  pull_request:
    paths:
      - '.github/workflows/test-api-e2e.yml'
      - 'packages/api/**'
      - 'packages/api-e2e/**'
      - 'examples/api/**'

env:
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0 # keeps the target folder small for better cache efficiency

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: Linux, os: ubuntu-latest }
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }

    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - run: npm i -g --force corepack
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            webkit2gtk-driver \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb \
            fluxbox

      # install a matching Microsoft Edge Driver version using msedgedriver-tool
      - name: install msedgedriver (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          $PWD.Path >> $env:GITHUB_PATH

      # Temporary diagnostics for the `DevToolsActivePort file doesn't exist`
      # failure: msedgedriver drives a WebView2 app by injecting
      # `--remote-debugging-port` through WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS
      # (which overrides the args wry sets), then waiting for the webview to
      # write DevToolsActivePort into the user data folder it points at. This
      # step reports whether the runner's Edge/WebView2 majors match the driver
      # and whether remote debugging is permitted on the machine at all.
      - name: webview2/msedgedriver diagnostics (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "### msedgedriver"
          & msedgedriver --version
          "### Edge"
          (Get-Item 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe').VersionInfo.ProductVersion
          "### WebView2 runtimes installed"
          Get-ChildItem 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application' -Directory -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name
          "### WebView2 runtime (registry pv)"
          foreach ($k in @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )) {
            if (Test-Path $k) { "$k -> $((Get-ItemProperty $k).pv)" } else { "$k -> absent" }
          }
          "### Edge/WebView2 policies (RemoteDebuggingAllowed blocks the debug port)"
          foreach ($k in @(
            'HKLM:\SOFTWARE\Policies\Microsoft\Edge',
            'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2',
            'HKCU:\SOFTWARE\Policies\Microsoft\Edge'
          )) {
            if (Test-Path $k) { "--- $k"; Get-ItemProperty $k | Format-List } else { "--- $k -> absent" }
          }
          "### can anything open a remote debugging port here?"
          $probeProfile = Join-Path $env:TEMP 'edge-remote-debug-probe'
          $edge = Start-Process 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe' `
            -ArgumentList '--headless=new', '--remote-debugging-port=9222', "--user-data-dir=$probeProfile", 'about:blank' `
            -PassThru
          $ok = $false
          foreach ($i in 1..20) {
            try {
              $version = Invoke-RestMethod 'http://127.0.0.1:9222/json/version' -TimeoutSec 2
              "remote debugging OK: $($version.Browser)"
              $ok = $true
              break
            } catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $ok) { "remote debugging port never came up (machine-level block)" }
          try { Stop-Process -Id $edge.Id -Force -ErrorAction Stop } catch {}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.os }}

      - name: install dependencies
        run: pnpm i --frozen-lockfile

      - name: build @tauri-apps/api
        run: pnpm build:api

      - name: build @tauri-apps/cli
        run: pnpm build:cli

      - name: run e2e tests (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 45
        # A real window manager (fluxbox) is started so that window-state tests
        # (minimize/maximize/fullscreen/position) behave. The tray host is absent
        # in this environment, so the tray module is skipped.
        run: |
          xvfb-run --auto-servernum -- bash -c '
            fluxbox >/dev/null 2>&1 &
            sleep 1
            E2E_SKIP=tray E2E_SPEC_RETRIES=1 pnpm test:api-e2e
          '

      - name: run e2e tests (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 45
        shell: pwsh
        run: |
          # Temporary: record the command line of every app/webview process the
          # driver launches, so we can see whether `--remote-debugging-port` and
          # the driver's `--user-data-dir` actually reach msedgewebview2.exe.
          $watcher = Start-Job {
            $seen = @{}
            while ($true) {
              Get-CimInstance Win32_Process -Filter "Name='api.exe' OR Name='msedgewebview2.exe'" -ErrorAction SilentlyContinue |
                Where-Object { $_.CommandLine -and -not $seen.ContainsKey($_.CommandLine) } |
                ForEach-Object { $seen[$_.CommandLine] = $true; "[$($_.Name)] $($_.CommandLine)" }
              Start-Sleep -Milliseconds 250
            }
          }

          $env:E2E_SKIP = "tray"
          $env:E2E_SPEC_RETRIES = "1"
          pnpm test:api-e2e
          $code = $LASTEXITCODE

          "### app/webview process command lines"
          Receive-Job $watcher
          Stop-Job $watcher; Remove-Job $watcher -Force
          "### DevToolsActivePort files on disk"
          Get-ChildItem $env:TEMP, "$env:LOCALAPPDATA", "$env:GITHUB_WORKSPACE\target\debug" `
            -Filter DevToolsActivePort -Recurse -Depth 6 -Force -ErrorAction SilentlyContinue |
            Select-Object -First 20 -Property FullName, LastWriteTime | Format-List

          exit $code

      - name: run e2e tests (macOS)
        if: runner.os == 'macOS' && env.CN_API_KEY != ''
        timeout-minutes: 45
        # macOS has no native WebDriver for WKWebView, so the app is driven through the
        # CrabNebula Webdriver (tauri-plugin-automation + test-runner-backend), which
        # authenticates with CN_API_KEY. wdio.conf enables it automatically on darwin and
        # builds the `.app` bundle it needs. The tray module is skipped to match the other jobs.
        run: E2E_SKIP=tray E2E_SPEC_RETRIES=1 pnpm test:api-e2e
        env:
          CN_API_KEY: ${{ secrets.TAURI_E2E_CN_API_KEY }}
