name: test `@tauri-apps/api` e2e

on:
  workflow_dispatch:
  push:
    branches:
      - dev
  pull_request:
    paths:
      - '.github/workflows/test-api-e2e.yml'
      - 'packages/api/**'
      - 'packages/api-e2e/**'
      - 'examples/api/**'
      - 'crates/tauri-runtime-cef/**'

env:
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0 # keeps the target folder small for better cache efficiency
  # Incremental artifacts are dropped from the cache anyway and only slow the builds down.
  CARGO_INCREMENTAL: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.platform.name }} (${{ matrix.runtime }})
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: Linux, os: ubuntu-latest }
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
        # The webview runtime `examples/api` is built with (see `E2E_RUNTIME` in
        # packages/api-e2e): the system webview through wry, or the Chromium
        # Embedded Framework through tauri-runtime-cef.
        runtime: [wry, cef]

    env:
      # The CrabNebula Webdriver (tauri-plugin-automation + test-runner-backend)
      # authenticates with this key. It is the only way to drive WKWebView on macOS
      # and a CEF app anywhere (the native WebKitWebDriver/msedgedriver only speak
      # to the system webview), so those runs are skipped when the secret is not
      # available (fork PRs). wdio.conf enables it automatically in both cases.
      CN_API_KEY: ${{ secrets.TAURI_E2E_CN_API_KEY }}
      E2E_SPEC_RETRIES: '1'
      E2E_SCRIPT: ${{ matrix.runtime == 'cef' && 'test:api-e2e:cef' || 'test:api-e2e' }}
      # macOS has no native WebDriver for WKWebView, so the app is driven through the
      # CrabNebula Webdriver (tauri-plugin-automation + test-runner-backend), which
      # authenticates with this key. Pull requests from forks do not get it, and the macOS
      # job then has nothing to test: the steps below skip the builds there rather than
      # occupy a macOS runner for them.
      HAS_CN_API_KEY: ${{ secrets.TAURI_E2E_CN_API_KEY != '' }}

    steps:
      - uses: actions/checkout@v7

      - name: install Rust 1.95
        # The MSRV, as the other jobs building the CLI use. The compiler version is part of
        # the rust-cache key, so a floating `stable` would also invalidate the entry below on
        # every Rust release.
        uses: dtolnay/rust-toolchain@1.95

      - run: npm i -g --force corepack
      - name: setup node
        if: runner.os != 'macOS' || env.HAS_CN_API_KEY == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      # wry links webkit2gtk (GTK 3) and is driven by WebKitWebDriver; the CEF
      # runtime links GTK 4 and ships its own Chromium, and the CrabNebula Webdriver
      # that drives it links libpipewire. `dbus` and `python3-gi` are for the session
      # bus and the StatusNotifierWatcher the test step runs (see there).
      - name: install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb \
            fluxbox \
            dbus \
            python3-gi \
            ${{ matrix.runtime == 'cef' && 'libgtk-4-dev libpipewire-0.3-0t64' || 'libwebkit2gtk-4.1-dev webkit2gtk-driver' }}
          # WebKitGTK reads the color scheme and tao the theme from the desktop portal when a
          # window is created. On the runner that portal is registered with D-Bus but never
          # comes up (there is no desktop session for it), so both calls only return on their
          # timeouts, 25s and 5s: about 30s per app start, and every spec starts the app.
          # Without a service file the name is unknown and both calls fail at once.
          sudo rm -f /usr/share/dbus-1/services/org.freedesktop.portal.Desktop.service

      - name: install msedgedriver (Windows)
        if: runner.os == 'Windows' && matrix.runtime == 'wry'
        # The driver has to match the WebView2 runtime, which registers its version with
        # EdgeUpdate under the client id below. This is what msedgedriver-tool does, minus
        # compiling the tool from source on every run (a minute).
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $client = 'Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = @(
            "HKLM:\SOFTWARE\WOW6432Node\$client",
            "HKLM:\SOFTWARE\$client",
            "HKCU:\SOFTWARE\WOW6432Node\$client",
            "HKCU:\SOFTWARE\$client"
          ) | ForEach-Object { (Get-ItemProperty -Path $_ -ErrorAction SilentlyContinue).pv } | Where-Object { $_ } | Select-Object -First 1
          if (-not $version) { throw 'no WebView2 runtime found in the registry' }
          $dir = Join-Path $env:RUNNER_TEMP 'msedgedriver'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile "$dir\edgedriver.zip"
          Expand-Archive "$dir\edgedriver.zip" -DestinationPath $dir -Force
          Write-Host "WebView2 $version; $(& "$dir\msedgedriver.exe" --version)"
          $dir >> $env:GITHUB_PATH

      - uses: Swatinem/rust-cache@v2
        if: runner.os != 'macOS' || env.HAS_CN_API_KEY == 'true'
        with:
          # The dependencies of the CLI and of the example app, both in the dev profile.
          # Only `dev` writes the entry: one saved from a pull request lives on its merge
          # ref, where nothing else can restore it, and every write evicts a `dev` entry
          # that other runs would have hit (10 GB repository limit, LRU eviction). Pull
          # requests restore the `dev` entry, so they get everything but the workspace
          # crates for free.
          shared-key: api-e2e-${{ matrix.runtime }}
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          # A flaky spec on `dev` must not throw the build away.
          cache-on-failure: true

      # The `cef` crate's build script downloads the CEF binary distribution into
      # `CEF_PATH/<cef version>/<os-arch>` (the CLI points it at a per-user cache
      # dir otherwise), and the bundler ships the framework from the same place, so
      # one cache entry per CEF version serves both. `$USERPROFILE` keeps the path
      # in Windows form for cargo, which bash's `$HOME` on Windows is not.
      - name: resolve CEF version
        if: matrix.runtime == 'cef'
        id: cef-version
        shell: bash
        run: |
          version=$(sed -nE 's/^cef = .*version = "=?([^"]+)".*/\1/p' crates/tauri-runtime-cef/Cargo.toml)
          if [ -z "$version" ]; then
            echo "could not resolve the cef crate version from crates/tauri-runtime-cef/Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "CEF_PATH=${USERPROFILE:-$HOME}/.cache/tauri-cef" >> "$GITHUB_ENV"

      - name: cache CEF
        if: matrix.runtime == 'cef'
        uses: actions/cache@v5.0.3
        with:
          path: ~/.cache/tauri-cef
          key: api-e2e-cef-${{ matrix.platform.os }}-${{ steps.cef-version.outputs.version }}

      - name: install dependencies
        if: runner.os != 'macOS' || env.HAS_CN_API_KEY == 'true'
        run: pnpm i --frozen-lockfile

      - name: build @tauri-apps/api
        if: runner.os != 'macOS' || env.HAS_CN_API_KEY == 'true'
        run: pnpm build:api

      - name: build @tauri-apps/cli
        if: runner.os != 'macOS' || env.HAS_CN_API_KEY == 'true'
        # Debug profile: the suite builds the example app with `tauri build --debug` anyway, and
        # a debug CLI reuses the cached dependencies instead of a from-scratch LTO build.
        run: pnpm build:cli:debug

      # Chromium's Linux sandbox needs either unprivileged user namespaces or a
      # root-owned setuid `chrome-sandbox` next to the binary, and aborts with
      # "No usable sandbox!" with neither. A `--no-bundle` build has the helper
      # without the setuid bit (the deb/rpm bundlers set it at install time), and
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor, so
      # lift that restriction for the runner.
      - name: allow unprivileged user namespaces (Linux, CEF)
        if: runner.os == 'Linux' && matrix.runtime == 'cef'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: run e2e tests (Linux)
        if: runner.os == 'Linux' && (matrix.runtime == 'wry' || env.CN_API_KEY != '')
        timeout-minutes: 45
        # A real window manager (fluxbox) is started so that window-state tests
        # (minimize/maximize/fullscreen/position) behave, and a StatusNotifierWatcher
        # so that the tray icon the app registers at startup (a StatusNotifierItem
        # on the session bus) has something to register with: without one the app
        # fails to start. `dbus-run-session` gives the watcher and the app the same
        # private session bus.
        run: |
          xvfb-run --auto-servernum -- dbus-run-session -- bash -c '
            fluxbox >/dev/null 2>&1 &
            python3 .scripts/ci/sni-watcher.py &
            sleep 1
            gdbus wait --session --timeout 10 org.kde.StatusNotifierWatcher
            pnpm $E2E_SCRIPT
          '

      - name: run e2e tests (Windows, wry)
        if: runner.os == 'Windows' && matrix.runtime == 'wry'
        timeout-minutes: 45
        shell: pwsh
        # msedgedriver hands the app the `--remote-debugging-port` it attaches to through
        # `WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS`, and WebView2 ignores that variable in an
        # elevated process, which is what the runner gives us. gsudo runs the suite at medium
        # integrity instead, and the workspace is opened up so the de-elevated process can use it.
        # See https://github.com/tauri-apps/wry/issues/1782 and
        # https://github.com/MicrosoftEdge/WebView2Feedback/issues/5645.
        run: |
          winget install gerardog.gsudo --accept-source-agreements --accept-package-agreements
          icacls "$env:GITHUB_WORKSPACE" /grant "Everyone:(OI)(CI)F"
          sudo --integrity Medium pnpm test:api-e2e

      # No WebView2 in the picture, so no msedgedriver and no de-elevation dance:
      # the CrabNebula Webdriver reaches the app through its IPC.
      - name: run e2e tests (Windows, CEF)
        if: runner.os == 'Windows' && matrix.runtime == 'cef' && env.CN_API_KEY != ''
        timeout-minutes: 45
        run: pnpm test:api-e2e:cef

      - name: run e2e tests (macOS)
        if: runner.os == 'macOS' && env.HAS_CN_API_KEY == 'true'
        timeout-minutes: 45
        env:
          CN_API_KEY: ${{ secrets.TAURI_E2E_CN_API_KEY }}
          E2E_SPEC_RETRIES: '1'
        # wdio.conf builds the `.app` bundle the CrabNebula Webdriver needs; for CEF
        # the bundler also ships the framework and builds the helper apps into it.
        run: pnpm $E2E_SCRIPT

      - name: collect app crash reports (macOS)
        if: runner.os == 'macOS' && failure()
        run: .scripts/ci/collect-macos-crash-reports.sh "$RUNNER_TEMP/crash-reports"

      - name: upload app crash reports (macOS)
        if: runner.os == 'macOS' && failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-crash-reports-${{ matrix.runtime }}
          path: ${{ runner.temp }}/crash-reports
          if-no-files-found: ignore
