name: test `@tauri-apps/api` e2e

on:
  workflow_dispatch:
  push:
    branches:
      - dev
  pull_request:
    paths:
      - '.github/workflows/test-api-e2e.yml'
      - 'packages/api/**'
      - 'packages/api-e2e/**'
      - 'examples/api/**'

env:
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0 # keeps the target folder small for better cache efficiency

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: Linux, os: ubuntu-latest }
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }

    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - run: npm i -g --force corepack
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            webkit2gtk-driver \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb \
            fluxbox

      # install a matching Microsoft Edge Driver version using msedgedriver-tool
      - name: install msedgedriver (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          $PWD.Path >> $env:GITHUB_PATH

      # Temporary diagnostics for the `DevToolsActivePort file doesn't exist`
      # failure: msedgedriver drives a WebView2 app by injecting
      # `--remote-debugging-port` through WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS
      # (which overrides the args wry sets), then waiting for the webview to
      # write DevToolsActivePort into the user data folder it points at. This
      # step reports whether the runner's Edge/WebView2 majors match the driver
      # and whether remote debugging is permitted on the machine at all.
      - name: webview2/msedgedriver diagnostics (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "### msedgedriver"
          & msedgedriver --version
          "### Edge"
          (Get-Item 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe').VersionInfo.ProductVersion
          "### WebView2 runtimes installed"
          Get-ChildItem 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application' -Directory -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name
          "### WebView2 runtime (registry pv)"
          foreach ($k in @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )) {
            if (Test-Path $k) { "$k -> $((Get-ItemProperty $k).pv)" } else { "$k -> absent" }
          }
          "### Edge/WebView2 policies (RemoteDebuggingAllowed blocks the debug port)"
          foreach ($k in @(
            'HKLM:\SOFTWARE\Policies\Microsoft\Edge',
            'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2',
            'HKCU:\SOFTWARE\Policies\Microsoft\Edge'
          )) {
            if (Test-Path $k) { "--- $k"; Get-ItemProperty $k | Format-List } else { "--- $k -> absent" }
          }
          "### can anything open a remote debugging port here?"
          $probeProfile = Join-Path $env:TEMP 'edge-remote-debug-probe'
          $edge = Start-Process 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe' `
            -ArgumentList '--headless=new', '--remote-debugging-port=9222', "--user-data-dir=$probeProfile", 'about:blank' `
            -PassThru
          $ok = $false
          foreach ($i in 1..20) {
            try {
              $version = Invoke-RestMethod 'http://127.0.0.1:9222/json/version' -TimeoutSec 2
              "remote debugging OK: $($version.Browser)"
              $ok = $true
              break
            } catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $ok) { "remote debugging port never came up (machine-level block)" }
          try { Stop-Process -Id $edge.Id -Force -ErrorAction Stop } catch {}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.os }}

      - name: install dependencies
        run: pnpm i --frozen-lockfile

      - name: build @tauri-apps/api
        run: pnpm build:api

      - name: build @tauri-apps/cli
        run: pnpm build:cli

      - name: run e2e tests (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 45
        # A real window manager (fluxbox) is started so that window-state tests
        # (minimize/maximize/fullscreen/position) behave. The tray host is absent
        # in this environment, so the tray module is skipped.
        run: |
          xvfb-run --auto-servernum -- bash -c '
            fluxbox >/dev/null 2>&1 &
            sleep 1
            E2E_SKIP=tray E2E_SPEC_RETRIES=1 pnpm test:api-e2e
          '

      # Temporary: one spec, no retries, so the diagnostics below are reached in
      # ~1 minute instead of after 33 failing attempts. This step also builds the
      # app (wdio.conf's onPrepare), which is why the full suite that follows
      # sets E2E_SKIP_BUILD. It records the command line of every app/webview
      # process the driver launches: msedgedriver drives a WebView2 app by
      # injecting `--remote-debugging-port=0` plus its own scoped
      # `--user-data-dir` through WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS, then
      # waits for the webview to write DevToolsActivePort into that folder.
      - name: e2e diagnostic run (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 45
        shell: pwsh
        working-directory: packages/api-e2e
        run: |
          $watcher = Start-Job {
            $seen = @{}
            while ($true) {
              Get-CimInstance Win32_Process -Filter "Name='api.exe' OR Name='msedgewebview2.exe'" -ErrorAction SilentlyContinue |
                Where-Object { $_.CommandLine -and -not $seen.ContainsKey($_.CommandLine) } |
                ForEach-Object { $seen[$_.CommandLine] = $true; "[$($_.Name)] $($_.CommandLine)" }
              Start-Sleep -Milliseconds 200
            }
          }

          $env:E2E_SPEC_RETRIES = "0"
          pnpm exec wdio run ./wdio.conf.ts --spec test/specs/app.spec.ts

          "### app/webview process command lines"
          Receive-Job $watcher
          Stop-Job $watcher; Remove-Job $watcher -Force
          "### DevToolsActivePort files on disk"
          Get-ChildItem $env:TEMP, "$env:LOCALAPPDATA", "$env:GITHUB_WORKSPACE\target\debug" `
            -Filter DevToolsActivePort -Recurse -Depth 6 -Force -ErrorAction SilentlyContinue |
            Select-Object -First 20 -Property FullName, LastWriteTime | Format-List
          "### msedgedriver scoped dirs left behind"
          Get-ChildItem $env:TEMP -Directory -Filter 'scoped_dir*' -ErrorAction SilentlyContinue |
            ForEach-Object { "$($_.FullName)"; Get-ChildItem $_.FullName -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 15 -ExpandProperty FullName }

      # Temporary: the CI webview command line shows only wry's own browser args
      # and no `--remote-debugging-port`, while the driver's user data folder IS
      # honored - so the runner's runtime is dropping
      # WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS instead of merging it with the args
      # wry passes via CreateCoreWebView2EnvironmentWithOptions. This probes that
      # env var directly against the built app; if it is ignored, it updates the
      # Evergreen runtime (runner has 150.0.4078.65) and probes again.
      - name: webview2 env-var probe (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $app = "$env:GITHUB_WORKSPACE\target\debug\api.exe"
          if (-not (Test-Path $app)) { "app not built, skipping probe"; exit 0 }

          function Invoke-Probe($label) {
            $udf = Join-Path $env:RUNNER_TEMP "probe-udf-$label"
            Remove-Item $udf -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force $udf | Out-Null
            $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9333'
            $env:WEBVIEW2_USER_DATA_FOLDER = $udf
            $proc = Start-Process $app -PassThru
            $ok = $false
            foreach ($i in 1..24) {
              try {
                $version = Invoke-RestMethod 'http://127.0.0.1:9333/json/version' -TimeoutSec 2
                Write-Host "[$label] DevTools OK: $($version.Browser)"
                $ok = $true
                break
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ok) { Write-Host "[$label] no DevTools on 9333 - WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS was ignored" }
            Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'" -ErrorAction SilentlyContinue |
              Where-Object { $_.CommandLine -like '*api.exe*' -and $_.CommandLine -notlike '*--type=*' } |
              ForEach-Object { ($_.CommandLine -split ' --') |
                Where-Object { $_ -match 'remote-debugging|disable-features' } |
                ForEach-Object { Write-Host "[$label] --$_" } }
            try { Stop-Process -Id $proc.Id -Force -ErrorAction Stop } catch {}
            Remove-Item Env:\WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS, Env:\WEBVIEW2_USER_DATA_FOLDER -ErrorAction SilentlyContinue
            return $ok
          }

          if (-not (Invoke-Probe 'runner-runtime')) {
            "### updating the Evergreen WebView2 runtime"
            $setup = "$env:RUNNER_TEMP\MicrosoftEdgeWebview2Setup.exe"
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $setup -UseBasicParsing
            Start-Process $setup -ArgumentList '/silent', '/install' -Wait
            "### WebView2 runtimes now installed"
            Get-ChildItem 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application' -Directory -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty Name
            Invoke-Probe 'updated-runtime' | Out-Null
          }

      - name: run e2e tests (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 45
        shell: pwsh
        run: |
          $env:E2E_SKIP = "tray"
          $env:E2E_SPEC_RETRIES = "1"
          $env:E2E_SKIP_BUILD = "1" # the diagnostic step above already built it
          pnpm test:api-e2e

      - name: run e2e tests (macOS)
        if: runner.os == 'macOS' && env.CN_API_KEY != ''
        timeout-minutes: 45
        # macOS has no native WebDriver for WKWebView, so the app is driven through the
        # CrabNebula Webdriver (tauri-plugin-automation + test-runner-backend), which
        # authenticates with CN_API_KEY. wdio.conf enables it automatically on darwin and
        # builds the `.app` bundle it needs. The tray module is skipped to match the other jobs.
        run: E2E_SKIP=tray E2E_SPEC_RETRIES=1 pnpm test:api-e2e
        env:
          CN_API_KEY: ${{ secrets.TAURI_E2E_CN_API_KEY }}
