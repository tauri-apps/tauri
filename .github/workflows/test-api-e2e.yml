name: test `@tauri-apps/api` e2e

on:
  workflow_dispatch:
  push:
    branches:
      - dev
  pull_request:
    paths:
      - '.github/workflows/test-api-e2e.yml'
      - 'packages/api/**'
      - 'packages/api-e2e/**'
      - 'examples/api/**'

env:
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0 # keeps the target folder small for better cache efficiency

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: Linux, os: ubuntu-latest }
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }

    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - run: npm i -g --force corepack
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            webkit2gtk-driver \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb \
            fluxbox

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.os }}

      - name: install dependencies
        run: pnpm i --frozen-lockfile

      - name: build @tauri-apps/api
        run: pnpm build:api

      - name: build @tauri-apps/cli
        run: pnpm build:cli

      - name: run e2e tests (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 45
        # A real window manager (fluxbox) is started so that window-state tests
        # (minimize/maximize/fullscreen/position) behave. The tray host is absent
        # in this environment, so the tray module is skipped.
        run: |
          xvfb-run --auto-servernum -- bash -c '
            fluxbox >/dev/null 2>&1 &
            sleep 1
            E2E_SKIP=tray E2E_SPEC_RETRIES=1 pnpm test:api-e2e
          '

      - name: run e2e tests (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 45
        shell: pwsh
        # tauri-driver drives the WebView2 webview through Microsoft Edge WebDriver.
        # The GitHub-hosted runner ships a version-matched msedgedriver.exe and points
        # $env:EdgeWebDriver at its folder, so put it on PATH for tauri-driver to find.
        # The runner has an interactive desktop session, so window-state tests run as-is;
        # the tray module is skipped to match the Linux job.
        run: |
          $env:PATH = "$env:EdgeWebDriver;$env:PATH"
          $env:E2E_SKIP = "tray"
          $env:E2E_SPEC_RETRIES = "1"
          pnpm test:api-e2e

      - name: run e2e tests (macOS)
        if: runner.os == 'macOS' && env.CN_API_KEY != ''
        timeout-minutes: 45
        # macOS has no native WebDriver for WKWebView, so the app is driven through the
        # CrabNebula Webdriver (tauri-plugin-automation + test-runner-backend), which
        # authenticates with CN_API_KEY. wdio.conf enables it automatically on darwin and
        # builds the `.app` bundle it needs. The tray module is skipped to match the other jobs.
        run: E2E_SKIP=tray E2E_SPEC_RETRIES=1 pnpm test:api-e2e
        env:
          CN_API_KEY: ${{ secrets.TAURI_E2E_CN_API_KEY }}
