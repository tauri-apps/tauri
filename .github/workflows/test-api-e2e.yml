name: test `@tauri-apps/api` e2e

on:
  workflow_dispatch:
  push:
    branches:
      - dev
  pull_request:
    paths:
      - '.github/workflows/test-api-e2e.yml'
      - 'packages/api/**'
      - 'packages/api-e2e/**'
      - 'examples/api/**'
      - 'crates/tauri-runtime-cef/**'

env:
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0 # keeps the target folder small for better cache efficiency

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.platform.name }} (${{ matrix.runtime }})
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: Linux, os: ubuntu-latest }
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
        # The webview runtime `examples/api` is built with (see `E2E_RUNTIME` in
        # packages/api-e2e): the system webview through wry, or the Chromium
        # Embedded Framework through tauri-runtime-cef.
        runtime: [wry, cef]

    env:
      # The CrabNebula Webdriver (tauri-plugin-automation + test-runner-backend)
      # authenticates with this key. It is the only way to drive WKWebView on macOS
      # and a CEF app anywhere (the native WebKitWebDriver/msedgedriver only speak
      # to the system webview), so those runs are skipped when the secret is not
      # available (fork PRs). wdio.conf enables it automatically in both cases.
      CN_API_KEY: ${{ secrets.TAURI_E2E_CN_API_KEY }}
      E2E_SPEC_RETRIES: '1'
      E2E_SCRIPT: ${{ matrix.runtime == 'cef' && 'test:api-e2e:cef' || 'test:api-e2e' }}

    steps:
      - uses: actions/checkout@v7

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - run: npm i -g --force corepack
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      # wry links webkit2gtk (GTK 3) and is driven by WebKitWebDriver; the CEF
      # runtime links GTK 4 and ships its own Chromium.
      - name: install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb \
            fluxbox \
            ${{ matrix.runtime == 'cef' && 'libgtk-4-dev' || 'libwebkit2gtk-4.1-dev webkit2gtk-driver' }}

      # install a matching Microsoft Edge Driver version using msedgedriver-tool
      - name: install msedgedriver (Windows)
        if: runner.os == 'Windows' && matrix.runtime == 'wry'
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          $PWD.Path >> $env:GITHUB_PATH

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.os }}-${{ matrix.runtime }}

      # The `cef` crate's build script downloads the CEF binary distribution into
      # `CEF_PATH/<cef version>/<os-arch>` (the CLI points it at a per-user cache
      # dir otherwise), and the bundler ships the framework from the same place, so
      # one cache entry per CEF version serves both. `$USERPROFILE` keeps the path
      # in Windows form for cargo, which bash's `$HOME` on Windows is not.
      - name: resolve CEF version
        if: matrix.runtime == 'cef'
        id: cef-version
        shell: bash
        run: |
          version=$(sed -nE 's/^cef = .*version = "=?([^"]+)".*/\1/p' crates/tauri-runtime-cef/Cargo.toml)
          if [ -z "$version" ]; then
            echo "could not resolve the cef crate version from crates/tauri-runtime-cef/Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "CEF_PATH=${USERPROFILE:-$HOME}/.cache/tauri-cef" >> "$GITHUB_ENV"

      - name: cache CEF
        if: matrix.runtime == 'cef'
        uses: actions/cache@v5.0.3
        with:
          path: ~/.cache/tauri-cef
          key: api-e2e-cef-${{ matrix.platform.os }}-${{ steps.cef-version.outputs.version }}

      - name: install dependencies
        run: pnpm i --frozen-lockfile

      - name: build @tauri-apps/api
        run: pnpm build:api

      - name: build @tauri-apps/cli
        run: pnpm build:cli

      # Chromium's Linux sandbox needs either unprivileged user namespaces or a
      # root-owned setuid `chrome-sandbox` next to the binary, and aborts with
      # "No usable sandbox!" with neither. A `--no-bundle` build has the helper
      # without the setuid bit (the deb/rpm bundlers set it at install time), and
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor, so
      # lift that restriction for the runner.
      - name: allow unprivileged user namespaces (Linux, CEF)
        if: runner.os == 'Linux' && matrix.runtime == 'cef'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: run e2e tests (Linux)
        if: runner.os == 'Linux' && (matrix.runtime == 'wry' || env.CN_API_KEY != '')
        timeout-minutes: 45
        # A real window manager (fluxbox) is started so that window-state tests
        # (minimize/maximize/fullscreen/position) behave.
        run: |
          xvfb-run --auto-servernum -- bash -c '
            fluxbox >/dev/null 2>&1 &
            sleep 1
            pnpm $E2E_SCRIPT
          '

      - name: run e2e tests (Windows, wry)
        if: runner.os == 'Windows' && matrix.runtime == 'wry'
        timeout-minutes: 45
        shell: pwsh
        # msedgedriver hands the app the `--remote-debugging-port` it attaches to through
        # `WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS`, and WebView2 ignores that variable in an
        # elevated process, which is what the runner gives us. gsudo runs the suite at medium
        # integrity instead, and the workspace is opened up so the de-elevated process can use it.
        # See https://github.com/tauri-apps/wry/issues/1782 and
        # https://github.com/MicrosoftEdge/WebView2Feedback/issues/5645.
        run: |
          winget install gerardog.gsudo --accept-source-agreements --accept-package-agreements
          icacls "$env:GITHUB_WORKSPACE" /grant "Everyone:(OI)(CI)F"
          sudo --integrity Medium pnpm test:api-e2e

      # No WebView2 in the picture, so no msedgedriver and no de-elevation dance:
      # the CrabNebula Webdriver reaches the app through its IPC.
      - name: run e2e tests (Windows, CEF)
        if: runner.os == 'Windows' && matrix.runtime == 'cef' && env.CN_API_KEY != ''
        timeout-minutes: 45
        run: pnpm test:api-e2e:cef

      - name: run e2e tests (macOS)
        if: runner.os == 'macOS' && env.CN_API_KEY != ''
        timeout-minutes: 45
        # wdio.conf builds the `.app` bundle the CrabNebula Webdriver needs; for CEF
        # the bundler also ships the framework and builds the helper apps into it.
        run: pnpm $E2E_SCRIPT

      - name: collect app crash reports (macOS)
        if: runner.os == 'macOS' && failure()
        run: .scripts/ci/collect-macos-crash-reports.sh "$RUNNER_TEMP/crash-reports"

      - name: upload app crash reports (macOS)
        if: runner.os == 'macOS' && failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-crash-reports-${{ matrix.runtime }}
          path: ${{ runner.temp }}/crash-reports
          if-no-files-found: ignore
