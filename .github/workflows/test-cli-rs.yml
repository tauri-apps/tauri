name: test `tauri-cli`

on:
  push:
    branches:
      - dev
  pull_request:
    paths:
      - '.github/workflows/test-cli-rs.yml'
      - 'crates/tauri-utils/**'
      - 'crates/tauri-bundler/**'
      - 'crates/tauri-cli/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

env:
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0 # This would add unnecessary bloat to the target folder, decreasing cache efficiency.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          # Same host build as the x86_64 job with the TLS features the aarch64 release uses.
          # It restores that job's cache and only rebuilds the difference, and never saves
          # (both jobs would otherwise race for the same cache key).
          - {
              target: aarch64-pc-windows-msvc,
              os: windows-latest,
              args: --no-default-features --features native-tls-vendored,
              restore-only: true
            }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }

    steps:
      - uses: actions/checkout@v7

      - name: 'Setup Rust'
        uses: dtolnay/rust-toolchain@1.90
        with:
          targets: ${{ matrix.platform.target }}

      - name: install Linux dependencies
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev webkit2gtk-4.1 libayatana-appindicator3-dev librsvg2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          # One entry per platform with tauri-cli's dependencies built in the dev profile on
          # the 1.90 toolchain. This job saves it; test-cli-js and test-android restore it
          # (same shared-key, same CARGO_*/RUST* env, same toolchain).
          shared-key: tauri-cli
          # Only `dev` writes to the cache: an entry saved from a pull request lives on its
          # merge ref, where nothing else can restore it, and every write evicts a `dev`
          # entry that other runs would have hit (10 GB repository limit, LRU eviction).
          save-if: ${{ github.ref == 'refs/heads/dev' && !matrix.platform.restore-only }}

      - name: test CLI
        run: cargo test --manifest-path ./crates/tauri-cli/Cargo.toml ${{ matrix.platform.args }}
