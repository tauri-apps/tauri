name: test core

on:
  push:
    branches:
      - dev
  pull_request:
    paths:
      - '.github/workflows/test-core.yml'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '!crates/tauri/scripts/**'
      - '!crates/tauri-cli/**'
      - '!crates/tauri-bundler/**'
      - '!crates/tauri-macos-sign/**'
      - '!crates/tauri-schema-generator/**'

env:
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0 # This would add unnecessary bloat to the target folder, decreasing cache efficiency.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          - {
              target: x86_64-pc-windows-msvc,
              os: windows-latest,
              toolchain: '1.95',
              cargo: cargo,
              command: 'test'
            }
          - {
              target: x86_64-unknown-linux-gnu,
              os: ubuntu-latest,
              toolchain: '1.95',
              cargo: cargo,
              command: 'test'
            }
          - {
              target: aarch64-apple-darwin,
              os: macos-14,
              toolchain: '1.95',
              cargo: cargo,
              command: 'test'
            }
          - {
              target: aarch64-apple-ios,
              os: macos-latest,
              toolchain: '1.95',
              cargo: cargo,
              command: 'build'
            }
          - {
              target: aarch64-linux-android,
              os: ubuntu-latest,
              toolchain: '1.95',
              cargo: cross,
              command: 'build'
            }
        features:
          - { args: --no-default-features, key: no-default }
          - { args: --all-features, key: all }
        exclude:
          - platform: { target: aarch64-apple-ios }
            features: { key: all }
          - platform: { target: aarch64-linux-android }
            features: { key: all }

    steps:
      - uses: actions/checkout@v7

      - name: install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.platform.toolchain }}
          targets: ${{ matrix.platform.target }}

      - name: install Linux dependencies
        if: contains(matrix.platform.target, 'unknown-linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y webkit2gtk-4.1 libxdo-dev libayatana-appindicator3-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.target }}
          save-if: ${{ matrix.features.key == 'all' }}

      # `export-cef-dir` defaults to the CEF binary distribution the `cef` bindings of its own version were
      # generated from, so installing it at the version the runtime depends on exports the distribution the
      # build links against. An older distribution is missing the entry points the newer bindings reference,
      # which fails the Windows link with unresolved externals.
      - name: resolve CEF version
        if: matrix.features.key == 'all'
        id: cef-version
        shell: bash
        run: |
          version=$(sed -nE 's/^cef = .*version = "=?([^"]+)".*/\1/p' crates/tauri-runtime-cef/Cargo.toml)
          if [ -z "$version" ]; then
            echo "could not resolve the cef crate version from crates/tauri-runtime-cef/Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache CEF
        if: matrix.features.key == 'all'
        id: cache-cef
        uses: actions/cache@v5.0.3
        with:
          path: ~/.local/share/cef
          key: cef-${{ matrix.platform.os }}-${{ steps.cef-version.outputs.version }}

      - name: ${{ steps.cache-cef.outputs.cache-hit && 'Use cache' || 'Export CEF' }}
        if: matrix.features.key == 'all'
        run: |
          ${{ steps.cache-cef.outputs.cache-hit && 'echo "Cached CEF"'
            || format('cargo install export-cef-dir --version ={0} && export-cef-dir "{1}/.local/share/cef"',
                steps.cef-version.outputs.version,
                matrix.platform.os == 'windows-latest' && '$env:USERPROFILE' || '$HOME')
          }}
          echo "CEF_PATH=${{ matrix.platform.os == 'windows-latest'
            && '$env:USERPROFILE'
            || '$HOME'
          }}/.local/share/cef" >> "$${{ matrix.platform.os == 'windows-latest'
            && 'env:'
            || ''
          }}GITHUB_ENV"
          echo "${{ startsWith(matrix.platform.os, 'macos-')
            && 'DYLD_FALLBACK_LIBRARY_PATH=$DYLD_FALLBACK_LIBRARY_PATH:$HOME/.local/share/cef:$HOME/.local/share/cef/Chromium Embedded Framework.framework/Libraries'
            || (matrix.platform.os == 'windows-latest'
              && 'PATH=$env:PATH;$env:USERPROFILE/.local/share/cef'
              || 'LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$HOME/.local/share/cef') }}" >> "$${{ matrix.platform.os == 'windows-latest'
                    && 'env:'
                    || ''
                  }}GITHUB_ENV"

      - name: install cross
        if: ${{ matrix.platform.cargo == 'cross' }}
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 51f46f296253d8122c927c5bb933e3c4f27cc317 --locked

      # `--all-features` is not usable on Linux for crates that see a runtime: it enables both
      # `tauri/gtk3` and `tauri/gtk4`, which are mutually exclusive because GTK 3 and GTK 4 cannot
      # be initialized in the same process. Use equivalent explicit sets on the GTK3 (wry) side;
      # the CEF runtime is linted separately in the lint-rust workflow.
      - name: resolve feature args
        shell: bash
        run: |
          if [ '${{ matrix.features.key }}' = 'all' ] && [ '${{ matrix.platform.target }}' = 'x86_64-unknown-linux-gnu' ]; then
            echo 'TAURI_FEATURES=--features __all-features-except-gtk,gtk3' >> "$GITHUB_ENV"
            echo 'TAURI_EXAMPLES_FEATURES=--features isolation' >> "$GITHUB_ENV"
            echo 'API_FEATURES=--features prod' >> "$GITHUB_ENV"
          else
            echo 'TAURI_FEATURES=${{ matrix.features.args }}' >> "$GITHUB_ENV"
            echo 'TAURI_EXAMPLES_FEATURES=${{ matrix.features.args }}' >> "$GITHUB_ENV"
            echo 'API_FEATURES=${{ matrix.features.args }}' >> "$GITHUB_ENV"
          fi

      - name: test tauri-utils
        # Using --lib --bins --tests to skip doc tests
        run: ${{ matrix.platform.cargo }} ${{ matrix.platform.command }} --target ${{ matrix.platform.target }} ${{ matrix.features.args }} --lib --bins --tests --manifest-path crates/tauri-utils/Cargo.toml

      - name: run acl-tests
        if: ${{ matrix.features.key != 'no-default' && matrix.platform.command == 'test' }}
        run: ${{ matrix.platform.cargo }} test --target ${{ matrix.platform.target }} ${{ matrix.features.args }} --manifest-path crates/tests/acl/Cargo.toml

      - name: test tauri
        run: ${{ matrix.platform.cargo }} ${{ matrix.features.key == 'no-default' && 'check' || matrix.platform.command }} --target ${{ matrix.platform.target }} ${{ env.TAURI_FEATURES }} --manifest-path crates/tauri/Cargo.toml

      - name: test tauri examples
        if: ${{ matrix.features.key != 'no-default' && matrix.platform.command == 'test' }}
        run: |
          ${{ matrix.platform.cargo }} test --target ${{ matrix.platform.target }} ${{ env.TAURI_EXAMPLES_FEATURES }} --examples --manifest-path crates/tauri-examples/Cargo.toml
          ${{ matrix.platform.cargo }} test --target ${{ matrix.platform.target }} ${{ env.API_FEATURES }} --manifest-path examples/api/src-tauri/Cargo.toml
