[workspace]
members = [
  "crates/tauri",
  "crates/tauri-runtime",
  "crates/tauri-runtime-wry",
  "crates/tauri-macros",
  "crates/tauri-utils",
  "crates/tauri-build",
  "crates/tauri-codegen",
  "crates/tauri-plugin",
  "crates/tauri-schema-generator",
  "crates/tauri-schema-worker",
  "crates/tauri-cli",
  "crates/tauri-bundler",
  "crates/tauri-macos-sign",
  "crates/tauri-driver",

  # @tauri-apps/cli rust project
  "packages/cli",

  # integration tests
  "crates/tests/restart",
  "crates/tests/acl",

  # bench
  "bench",
  "bench/tests/cpu_intensive/src-tauri",
  "bench/tests/files_transfer/src-tauri",
  "bench/tests/helloworld/src-tauri",

  # examples
  "examples/file-associations/src-tauri",
  "examples/resources/src-tauri",
  "examples/api/src-tauri",
  "examples/api/src-tauri/tauri-plugin-sample",
]
resolver = "3"

[workspace.package]
authors = ["Tauri Programme within The Commons Conservancy"]
homepage = "https://tauri.app/"
repository = "https://github.com/tauri-apps/tauri"
categories = ["gui", "web-programming"]
license = "Apache-2.0 OR MIT"
edition = "2024"
rust-version = "1.92"

[workspace.dependencies]
tauri = { version = "2.12.3", path = "./crates/tauri", default-features = false }
tauri-runtime = { version = "~2.12.1", path = "./crates/tauri-runtime" }
tauri-runtime-wry = { version = "~2.12.1", path = "./crates/tauri-runtime-wry", default-features = false }
tauri-build = { version = "2.7.2", path = "./crates/tauri-build", default-features = false }
tauri-macros = { version = "~2.7.2", path = "./crates/tauri-macros" }
tauri-codegen = { version = "~2.7.2", path = "./crates/tauri-codegen" }
tauri-utils = { version = "~2.10.1", path = "./crates/tauri-utils" }
tauri-plugin = { version = "2.7.1", path = "./crates/tauri-plugin", default-features = false }
tauri-bundler = { version = "=2.10.2", path = "./crates/tauri-bundler", default-features = false }
tauri-macos-sign = { version = "=2.4.1", path = "./crates/tauri-macos-sign" }

# default to small, optimized workspace release binaries
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
strip = true

# profiles for tauri-cli
[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.release-size-optimized]
inherits = "release"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"

# Temporary patch to schemars to preserve newlines in docstrings for our reference docs schemas
# See https://github.com/GREsau/schemars/issues/120 for reference
[patch.crates-io]
schemars_derive = { git = 'https://github.com/tauri-apps/schemars.git', branch = 'feat/preserve-description-newlines' }
tauri = { path = "./crates/tauri" }
tauri-plugin = { path = "./crates/tauri-plugin" }

webkit2gtk = { git = "https://github.com/tauri-apps/webkit2gtk-rs.git", branch = "bump-gir" }
webkit2gtk-sys = { git = "https://github.com/tauri-apps/webkit2gtk-rs.git", branch = "bump-gir" }
tao = { git = "https://github.com/tauri-apps/tao.git", branch = "gtk-0.19" }
wry = { git = "https://github.com/tauri-apps/wry.git", branch = "gtk-0.19" }
muda = { git = "https://github.com/tauri-apps/muda.git", branch = "renovate/gtk-0.x" }
tray-icon = { git = "https://github.com/tauri-apps/tray-icon.git", branch = "gtk-0.19" }
libappindicator = { git = "https://github.com/tauri-apps/libappindicator-rs.git", branch = "gtk-0.19" }

[workspace.lints.clippy]
# TODO: Update in next PR to keep changes small, see https://github.com/tauri-apps/tauri/pull/16029
collapsible_if = "allow"

redundant_clone = "warn"
assigning_clones = "warn"
or_fun_call = "warn"
