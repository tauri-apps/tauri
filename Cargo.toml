tauri = { path = "crates/tauri", default-features = false }
tauri-bundler = { version = "2.2.3", path = "crates/tauri-bundler", default-features = false }
tauri-cli = { path = "crates/tauri-cli", default-features = false }
tauri-codegen = { version = "2.0.4", path = "crates/tauri-codegen", default-features = false }
tauri-macros = { version = "2.0.4", path = "crates/tauri-macros" }
tauri-plugin = { path = "crates/tauri-plugin" }
tauri-plugin-log = "2"
tauri-plugin-sample = { path = "examples/api/src-tauri/tauri-plugin-sample" }
tauri-runtime = { version = "2.3.0", path = "crates/tauri-runtime" }
tauri-runtime-wry = { version = "2.3.0", path = "crates/tauri-runtime-wry" }
