[package]
name = "bench_assets"
version = "0.1.0"
description = "A Tauri application with a frontend the size of a real one"
edition = "2024"
rust-version = "1.92"

[build-dependencies]
tauri-build = { workspace = true, default-features = true, features = [
  "codegen",
] }

[dependencies]
bench_common = { path = "../../common" }
tauri = { workspace = true, default-features = true }

[features]
# Production mode, which is what the benchmarks measure. It is a feature so the apps do not
# turn off `cfg(dev)` for every crate when the whole workspace is built or analyzed.
prod = ["tauri/custom-protocol"]

[lints]
workspace = true
