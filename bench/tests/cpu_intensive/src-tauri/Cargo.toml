[package]
name = "bench_cpu_intensive"
version = "0.1.0"
description = "A very simple Tauri Application"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { workspace = true, features = ["codegen"] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { workspace = true, default-features = true }
