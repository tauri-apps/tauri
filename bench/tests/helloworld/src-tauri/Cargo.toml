[package]
name = "bench_helloworld"
version = "0.1.0"
description = "A very simple Tauri Application"
edition = "2024"
rust-version = "1.92"

[build-dependencies]
tauri-build = { workspace = true, default-features = true, features = [
  "codegen",
] }

[dependencies]
bench_common = { path = "../../common" }
tauri = { workspace = true, features = ["wry", "custom-protocol"] }

[features]
# The runner also measures the size of this app built with `--no-default-features`,
# which tells how much the default features of tauri cost.
default = ["tauri/default"]

[lints]
workspace = true
