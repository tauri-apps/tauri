[package]
name = "bench_helloworld"
version = "0.1.0"
description = "A very simple Tauri Application"
edition = "2024"
rust-version = "1.95"

[build-dependencies]
tauri-build = { workspace = true, default-features = true, features = [
  "codegen",
] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { workspace = true, default-features = true }
tauri-runtime-wry = { workspace = true, default-features = true, optional = true }
tauri-runtime-cef = { workspace = true, default-features = true, optional = true }

[features]
default = ["wry"]
cef = ["dep:tauri-runtime-cef"]
wry = ["dep:tauri-runtime-wry"]
