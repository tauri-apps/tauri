[package]
name = "bench_ipc"
version = "0.1.0"
description = "Measures the Tauri IPC"
edition = "2024"
rust-version = "1.92"

[build-dependencies]
tauri-build = { workspace = true, default-features = true, features = [
  "codegen",
] }

[dependencies]
bench_common = { path = "../../common" }
serde = { version = "1", features = ["derive"] }
tauri = { workspace = true, default-features = true, features = [
  "custom-protocol",
] }

[lints]
workspace = true
