[package]
name = "tauri-build"
version = "2.0.5"
description = "build time code to pair with https://crates.io/crates/tauri"
exclude = ["CHANGELOG.md", "/target"]
readme = "README.md"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-linux-android",
  "x86_64-apple-ios",
]
rustc-args = ["--cfg", "docsrs"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
anyhow = { workspace = true }
quote = { workspace = true, optional = true }
tauri-codegen = { workspace = true, optional = true }
tauri-utils = { version = "2.1.1", path = "../tauri-utils", features = [
  "build",
  "resources",
] }
cargo_toml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
heck = { workspace = true }
json-patch = { workspace = true }
walkdir = { workspace = true }
tauri-winres = { workspace = true }
semver = { workspace = true }
dirs = { workspace = true }
glob = { workspace = true }
toml = { workspace = true }
# Our code requires at least 0.8.18 so don't simplify this to 0.8
schemars = { workspace = true, features = ["preserve_order"] }

[features]
default = ["config-json"]
codegen = ["tauri-codegen", "quote"]
isolation = ["tauri-codegen/isolation", "tauri-utils/isolation"]
config-json = []
config-json5 = ["tauri-utils/config-json5"]
config-toml = ["tauri-utils/config-toml"]
