[package]
name = "tauri-bundler"
version = "2.10.3"
authors = [
  "George Burton <burtonageo@gmail.com>",
  "Tauri Programme within The Commons Conservancy",
]
categories = ["command-line-utilities", "development-tools::cargo-plugins"]
license = "Apache-2.0 OR MIT"
keywords = ["bundle", "cargo", "tauri"]
repository = "https://github.com/tauri-apps/tauri"
description = "Wrap rust executables in OS-specific app bundles for Tauri"
edition = "2024"
rust-version = "1.90"
exclude = ["CHANGELOG.md", "/target", "rustfmt.toml"]

[dependencies]
tauri-utils = { workspace = true, features = ["resources"] }
image = "0.25"
flate2 = "1"
thiserror = "2"
anyhow = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
strsim = "0.11"
tar = "0.4"
walkdir = "2"
bytesize = "2"
handlebars = "6"
tempfile = "3"
log = { version = "0.4.21", features = ["kv"] }
dirs = "7"
os_pipe = "1"
ureq = { version = "3", default-features = false, features = ["socks-proxy"] }
native-tls = { version = "0.2", optional = true }
hex = "0.4"
semver = "1"
sha1 = "0.11"
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }
dunce = "1"
url = "2"
uuid = { version = "1", features = ["v4", "v5"] }
regex = "1"
plist = "1"
glob = "0.3"

[target."cfg(target_os = \"macos\")".dependencies]
time = { version = "0.3", features = ["formatting"] }
tauri-macos-sign = { workspace = true }
icns = { package = "tauri-icns", version = "0.1" }

# The macOS bundle layout is also built when cross-compiling from Linux, which
# needs the icon encoder, the HFS+ image writer and the DMG container writer, but
# not the macOS-only signing/notarization stack.
[target."cfg(target_os = \"linux\")".dependencies]
heck = "0.5"
ar = "0.9"
md5 = "0.8"
rpm = { version = "0.30", features = ["bzip2-compression"] }
icns = { package = "tauri-icns", version = "0.1" }
# Pure Rust HFS+ writer and UDIF writer, so building a DMG on Linux does not
# need mkfs.hfsplus, libdmg-hfsplus, or any other external binary.
fstool = { version = "0.5", default-features = false, features = ["hfs-plus"] }
udif = "0.4"
# `rcodesign` replacement: ad-hoc signatures for cross-compiled Mach-O
# binaries. Patched to the upstream git revision in the workspace `Cargo.toml`
# to avoid the `lzma` native library clash with `rpm`.
apple-codesign = { version = "0.29", default-features = false }

[target."cfg(target_os = \"windows\")".dependencies]
bitness = "0.4"
windows-registry = "0.6"

[target."cfg(target_os = \"windows\")".dependencies.windows-sys]
version = "0.61"
features = ["Win32_System_SystemInformation", "Win32_System_Diagnostics_Debug"]

[target."cfg(unix)".dependencies]
which = "8"

[lib]
name = "tauri_bundler"
path = "src/lib.rs"

[features]
default = ["rustls", "platform-certs"]
native-tls = ["ureq/native-tls"]
native-tls-vendored = ["native-tls", "native-tls/vendored"]
rustls = ["ureq/rustls"]
platform-certs = ["ureq/platform-verifier"]

[lints]
workspace = true

[dev-dependencies]
serial_test = "3.5"
