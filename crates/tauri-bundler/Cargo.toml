[package]
name = "tauri-bundler"
version = "2.2.3"
authors = [
  "George Burton <burtonageo@gmail.com>",
  "Tauri Programme within The Commons Conservancy",
]
categories = ["command-line-utilities", "development-tools::cargo-plugins"]
license = "Apache-2.0 OR MIT"
keywords = ["bundle", "cargo", "tauri"]
repository = "https://github.com/tauri-apps/tauri"
description = "Wrap rust executables in OS-specific app bundles for Tauri"
edition = "2021"
rust-version = "1.77.2"
exclude = ["CHANGELOG.md", "/target", "rustfmt.toml"]

[dependencies]
tauri-utils = { version = "2.1.1", path = "../tauri-utils", features = [
  "resources",
] }
image = { workspace = true }
flate2 = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
strsim = { workspace = true }
tar = { workspace = true }
walkdir = { workspace = true }
handlebars = { workspace = true }
tempfile = { workspace = true }
log = { workspace = true, features = ["kv"] }
dirs = { workspace = true }
os_pipe = { workspace = true }
ureq = { workspace = true, features = ["socks-proxy"] }
native-tls = { workspace = true, optional = true }
hex = { workspace = true }
semver = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
zip = { workspace = true, features = ["deflate"] }
dunce = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5"] }
regex = { workspace = true }

[target."cfg(target_os = \"windows\")".dependencies]
bitness = "0.4"
windows-registry = "0.4"
glob = "0.3"

[target."cfg(target_os = \"windows\")".dependencies.windows-sys]
version = "0.59"
features = ["Win32_System_SystemInformation", "Win32_System_Diagnostics_Debug"]

[target."cfg(target_os = \"macos\")".dependencies]
icns = { package = "tauri-icns", version = "0.1" }
time = { version = "0.3", features = ["formatting"] }
plist = "1"
tauri-macos-sign = { version = "2.0.1", path = "../tauri-macos-sign" }

[target."cfg(target_os = \"linux\")".dependencies]
heck = "0.5"
ar = "0.9"
md5 = "0.7"
rpm = { version = "0.16", features = ["bzip2-compression"] }

[lib]
name = "tauri_bundler"
path = "src/lib.rs"

[features]
default = ["rustls"]
native-tls = ["ureq/native-tls"]
native-tls-vendored = ["native-tls", "native-tls/vendored"]
rustls = ["ureq/rustls"]
