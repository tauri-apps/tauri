[package]
name = "tauri-ffi"
version = "0.1.0"
description = "Experimental C ABI for embedding Tauri from non-Rust hosts (see /ffi-bindings-plan.md)"
edition = "2021"
publish = false
license = "Apache-2.0 OR MIT"

[lib]
name = "tauri_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

# CEF subprocess helper. CEF is multi-process: the browser process launches its
# renderer/GPU/utility subprocesses by executing a helper program with a
# `--type=` switch. A Rust app re-executes itself (see `#[cef_entry_point]`), but
# a bindings host (node/deno/python) can't act as a CEF subprocess, so the cef
# library points CEF's `browser_subprocess_path` at this dedicated executable.
# Only built for the cef runtime and distributed next to `libtauri_cef`/`libcef`.
[[bin]]
name = "tauri-cef-helper"
path = "src/bin/cef_helper.rs"
required-features = ["runtime-cef"]

[features]
default = ["runtime-wry"]

# Runtime backend compiled into the cdylib. Exactly one is selected; the exported
# C ABI (`tauri_ffi.h`, the `tauri_ffi_*`/`tauri_*` symbols) is identical across
# runtimes, so only the *produced library* differs and is distributed per runtime
# — `libtauri_wry`, `libtauri_cef`, … (dropping the redundant `_ffi` suffix). The
# publish workflow builds `--features runtime-<name>` and stages the output under
# the runtime's library name; see bindings/scripts/targets.mjs (RUNTIMES).
#
# The tauri dep sets `default-features = false` so exactly one runtime is linked
# into the cdylib; each `runtime-*` feature re-adds its runtime backend plus the
# runtime-specific tauri defaults (wry uses x11/dbus on Linux). Build the desired
# library with e.g. `--no-default-features --features runtime-cef`.
runtime-wry = ["tauri/wry", "tauri/x11", "tauri/dbus"]
runtime-cef = ["tauri/cef"]

# Exposes tauri_window_open_devtools/close_devtools/is_devtools_open in release
# builds (they are always available in debug builds). Mirrors `tauri/devtools`.
devtools = ["tauri/devtools"]

[dependencies]
# default-features disabled so the runtime backend comes solely from the selected
# `runtime-*` feature. tauri's non-runtime defaults (compression, common-controls-v6,
# dynamic-acl) are re-added here; wry/x11/dbus move to the `runtime-wry` feature.
tauri = { path = "../tauri", default-features = false, features = [
  "compression",
  "common-controls-v6",
  "unstable",
  # Compile in "production" mode: tauri decides dev-vs-prod at build time via
  # the `dev` cfg (`dev = !custom-protocol`, see tauri/build.rs). Without this,
  # the cdylib is permanently in dev mode and `get_app_url` always serves
  # `build.devUrl` (blank in a shipped app whose config has a devUrl). We build
  # once and drive dev-vs-prod at runtime instead: `tauri_app_builder_set_dev`
  # rewrites `frontend_dist` to the devUrl, which `get_app_url` then uses.
  "custom-protocol",
  "tray-icon",
  "protocol-asset",
  # `dynamic-acl` is required for runtime capability resolution.
  "dynamic-acl",
  # image decoding for tray icons loaded from a file path (tauri_tray_set_icon).
  "image-png",
  "image-ico",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Official first-party plugins bundled into the cdylib so non-Rust hosts get the
# standard app capabilities (the `@tauri-apps/plugin-*` JS packages talk to these).
# Every desktop-capable plugin is included; the 5 mobile-only plugins (barcode-scanner,
# biometric, geolocation, haptics, nfc) are excluded for the desktop-only v0 scope.
# Pulled from crates.io; each depends on `tauri`/`tauri-plugin`/`tauri-utils` (also from
# crates.io), which the workspace-root `[patch.crates-io]` redirects to this repo's local
# crates so there is a single `tauri`. Their permission manifests + global API scripts
# surface through `build.rs`'s DEP_TAURI_* collection automatically.
tauri-plugin-autostart = "2"
tauri-plugin-cli = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-http = "2"
tauri-plugin-localhost = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-positioner = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
# `sql` has no default features; a driver must be selected. Enable SQLite (the common default).
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-store = "2"
tauri-plugin-stronghold = "2"
tauri-plugin-updater = "2"
tauri-plugin-upload = "2"
tauri-plugin-websocket = "2"
tauri-plugin-window-state = "2"

[build-dependencies]
# `build-2` exposes tauri_utils::acl::build, used to collect the core plugin
# permission manifests advertised by tauri's build script (DEP_TAURI_*).
tauri-utils = { path = "../tauri-utils", features = ["build-2"] }
serde_json = "1"
