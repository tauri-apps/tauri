[package]
name = "tauri-runtime-wry"
version = "2.3.0"
description = "Wry bindings to the Tauri runtime"
exclude = ["CHANGELOG.md", "/target"]
readme = "README.md"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
rustc-args = ["--cfg", "docsrs"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
wry = { workspace = true, features = ["drag-drop", "protocol", "os-webview", "linux-body"] }
tao = { workspace = true, features = ["rwh_06"] }
tauri-runtime = { workspace = true }
tauri-utils = { version = "2.1.1", path = "../tauri-utils" }
raw-window-handle = { workspace = true }
http = { workspace = true }
url = { workspace = true }
tracing = { workspace = true, optional = true }
log = { workspace = true }

[target."cfg(windows)".dependencies]
webview2-com = "0.34"
softbuffer = { version = "0.4", default-features = false }

[target."cfg(windows)".dependencies.windows]
version = "0.58"
features = ["Win32_Foundation", "Win32_Graphics_Dwm"]

[target."cfg(any(target_os = \"linux\", target_os = \"dragonfly\", target_os = \"freebsd\", target_os = \"openbsd\", target_os = \"netbsd\"))".dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
webkit2gtk = { version = "=2.0", features = ["v2_40"] }
percent-encoding = "2"

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.2", features = [] }
objc2-app-kit = { version = "0.2", features = [
  "block2",
  "NSApplication",
  "NSResponder",
  "NSView",
  "NSWindow",
  "NSGraphics",
] }

[target."cfg(target_os = \"android\")".dependencies]
jni = "0.21"

[features]
devtools = ["wry/devtools", "tauri-runtime/devtools"]
macos-private-api = [
  "wry/fullscreen",
  "wry/transparent",
  "tauri-runtime/macos-private-api",
]
objc-exception = ["wry/objc-exception"]
tracing = ["dep:tracing", "wry/tracing"]
macos-proxy = ["wry/mac-proxy"]
unstable = []
