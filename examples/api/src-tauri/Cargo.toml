[package]
name = "api"
version = "0.1.0"
description = "An example Tauri Application showcasing the api"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"

[lib]
name = "api_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true, default-features = true, features = [
  "codegen",
  "isolation",
] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4.21"
tauri-plugin-sample = { path = "./tauri-plugin-sample/" }
tauri-plugin-log = "3.0.0-alpha.1"

# WebDriver automation bridge, used by the `@tauri-apps/api` e2e suite (packages/api-e2e).
# Desktop-only and behind the off-by-default `automation` feature so it never ships in a
# regular build.
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-automation = { version = "3.0.0-alpha.2", optional = true }

[dependencies.tauri]
workspace = true
default-features = false
features = [
  "protocol-asset",
  "image-ico",
  "image-png",
  "isolation",
  "tray-icon",
]

[dependencies.tauri-runtime-wry]
workspace = true
default-features = true
optional = true

[dependencies.tauri-runtime-cef]
workspace = true
default-features = true
optional = true

[dev-dependencies.tauri]
workspace = true
default-features = false
features = ["test"]

[features]
default = ["wry"]
wry = ["dep:tauri-runtime-wry"]
prod = ["tauri/custom-protocol"]
cef = ["dep:tauri-runtime-cef"]
# Enables the WebDriver automation bridge; set by the e2e suite's build (packages/api-e2e).
automation = ["dep:tauri-plugin-automation"]
