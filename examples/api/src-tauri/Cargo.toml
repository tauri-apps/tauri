[package]
name = "api"
version = "0.1.0"
description = "An example Tauri Application showcasing the api"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"

[lib]
name = "api_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true, default-features = true, features = [
  "codegen",
  "isolation",
] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4.21"
tauri-plugin-sample = { path = "./tauri-plugin-sample/" }
tauri-plugin-log = "2"

[dependencies.tauri]
workspace = true
default-features = false
features = [
  "protocol-asset",
  "image-ico",
  "image-png",
  "isolation",
  "tray-icon",
]

[dependencies.tauri-runtime-wry]
workspace = true
default-features = true
optional = true

[dependencies.tauri-runtime-cef]
workspace = true
default-features = true
optional = true

[dev-dependencies.tauri]
workspace = true
default-features = false
features = ["test"]

[features]
default = ["wry"]
wry = ["dep:tauri-runtime-wry"]
prod = ["tauri/custom-protocol"]
cef = ["dep:tauri-runtime-cef"]
