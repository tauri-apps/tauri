<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>CEF offscreen rendering</title>
<style>
  html, body { margin: 0; background: transparent; font: 16px system-ui; }
  aside { margin: 24px; padding: 20px; width: 330px; background: #fffffff0; border-radius: 12px; }
  input, select, button { font: inherit; margin: 8px 0; padding: 6px; }
  #drag { padding: 16px; background: #ccdfff; cursor: grab; user-select: none; touch-action: none; }
  #scroll { height: 80px; overflow: auto; }
</style>
<aside>
  <h1>CEF + native Vello</h1>
  <p>The shapes behind this panel are rendered by native Vello. This panel is a windowless Tauri webview.</p>
  <label>Text / IME <input placeholder="Type here, including 日本語"></label>
  <select aria-label="Popup"><option>Open a popup</option><option>Second option</option><option>Third option</option></select>
  <button id="invoke">Call Rust</button><output id="result"></output>
  <div id="drag">Drag here</div>
  <div id="scroll"><p>Scroll this area.</p><p>Second line.</p><p>Third line.</p><p>Last line.</p></div>
</aside>
<script>
  document.querySelector('#invoke').onclick = async () => {
    document.querySelector('#result').textContent = await window.__TAURI__.core.invoke('greet');
  };
  const drag = document.querySelector('#drag');
  drag.onpointerdown = e => drag.setPointerCapture(e.pointerId);
  drag.onpointermove = e => {
    if (drag.hasPointerCapture(e.pointerId)) drag.textContent = `Dragging: ${Math.round(e.clientX)}, ${Math.round(e.clientY)}`;
  };
  drag.onpointerup = () => drag.textContent = 'Drag finished';
</script>
</html>
