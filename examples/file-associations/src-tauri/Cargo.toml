[package]
name = "tauri-file-associations-demo"
version = "0.1.0"
description = "A Tauri application that associate file types"
edition = "2024"
rust-version = "1.88"

[build-dependencies]
tauri-build = { path = "../../../crates/tauri-build", features = ["codegen"] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { path = "../../../crates/tauri", features = ["protocol-asset"] }
tauri-runtime-wry = { path = "../../../crates/tauri-runtime-wry", optional = true }
tauri-runtime-cef = { path = "../../../crates/tauri-runtime-cef", optional = true }
url = "2"

[features]
default = ["wry"]
wry = ["dep:tauri-runtime-wry"]
cef = ["dep:tauri-runtime-cef"]
