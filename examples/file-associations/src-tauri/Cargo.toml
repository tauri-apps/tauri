[package]
name = "tauri-file-associations-demo"
version = "0.1.0"
description = "A Tauri application that associate file types"
edition = "2024"
rust-version = "1.95"

[build-dependencies]
tauri-build = { workspace = true, default-features = true, features = [
  "codegen",
] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { workspace = true, default-features = true, features = [
  "protocol-asset",
] }
url = "2"

[features]
cef = ["tauri/cef"]
wry = ["tauri/wry"]
