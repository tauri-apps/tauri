[package]
name = "qt-app"
version = "0.1.0"
description = "A Tauri application showcasing the Qt runtime, with an in-page self-test"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
publish = false

[build-dependencies]
tauri-build = { workspace = true, default-features = true }

[dependencies]
tauri = { workspace = true, default-features = true, features = ["devtools", "tray-icon", "unstable", "image-png"] }
tauri-runtime-qt = { workspace = true, features = ["devtools"] }
env_logger = "0.11"
serde_json = "1"
