<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>About Qt Browser</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="pages.css" />
  </head>
  <body>
    <main>
      <h1>About Qt Browser</h1>
      <section>
        <h2>Browser</h2>
        <div class="row"><span>Version</span><span id="version"></span></div>
        <div class="row"><span>Tauri</span><span id="tauri"></span></div>
        <div class="row"><span>Web engine</span><span id="webview"></span></div>
        <div class="row">
          <span>Restart<small>process plugin</small></span>
          <button id="restart" class="button" type="button">Restart</button>
        </div>
      </section>
      <section>
        <h2>System<small> (os plugin)</small></h2>
        <div class="row">
          <span>Operating system</span><span id="os"></span>
        </div>
        <div class="row"><span>Architecture</span><span id="arch"></span></div>
        <div class="row"><span>Locale</span><span id="locale"></span></div>
        <div class="row"><span>Host name</span><span id="hostname"></span></div>
      </section>
      <section>
        <h2>Folders</h2>
        <div class="row"><span>Settings</span><code id="config"></code></div>
        <div class="row"><span>Data</span><code id="data"></code></div>
        <div class="row"><span>Logs</span><code id="logs"></code></div>
        <div class="row">
          <span>Downloads</span><code id="downloads"></code>
        </div>
      </section>
      <section>
        <h2>Global shortcut</h2>
        <div class="row">
          <span id="shortcut"></span><span id="shortcutState"></span>
        </div>
      </section>
    </main>
    <script src="about.js"></script>
  </body>
</html>
