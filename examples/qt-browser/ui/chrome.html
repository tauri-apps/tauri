<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Qt Browser</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="chrome.css" />
  </head>
  <body>
    <!-- Title bar: the tab strip; its empty parts drag the window, double-click maximizes. -->
    <header id="titlebar" data-tauri-drag-region>
      <div id="tabs" role="tablist" data-tauri-drag-region></div>
      <button
        id="new-tab"
        class="icon"
        title="New tab (Ctrl+T)"
        aria-label="New tab"
      >
        +
      </button>
      <div class="spacer" data-tauri-drag-region></div>
      <div id="window-controls">
        <button id="minimize" title="Minimize" aria-label="Minimize">
          <svg viewBox="0 0 10 10"><path d="M1 5h8" /></svg>
        </button>
        <button id="maximize" title="Maximize" aria-label="Maximize">
          <svg viewBox="0 0 10 10">
            <rect x="1.5" y="1.5" width="7" height="7" />
          </svg>
        </button>
        <button id="close" class="danger" title="Close" aria-label="Close">
          <svg viewBox="0 0 10 10"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" /></svg>
        </button>
      </div>
    </header>

    <!-- Toolbar: navigation, address bar, zoom and the "⋮" menu. -->
    <nav id="toolbar">
      <button id="back" class="icon" title="Back (Alt+Left)" aria-label="Back">
        <svg viewBox="0 0 16 16"><path d="M10 3L5 8l5 5" /></svg>
      </button>
      <button
        id="forward"
        class="icon"
        title="Forward (Alt+Right)"
        aria-label="Forward"
      >
        <svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5" /></svg>
      </button>
      <button
        id="reload"
        class="icon"
        title="Reload (Ctrl+R)"
        aria-label="Reload"
      >
        <svg class="reload" viewBox="0 0 16 16">
          <path d="M13 8a5 5 0 1 1-1.5-3.5M13 2.5V5h-2.5" />
        </svg>
        <svg class="stop" viewBox="0 0 16 16">
          <path d="M4 4l8 8M12 4l-8 8" />
        </svg>
      </button>
      <button id="home" class="icon" title="Home" aria-label="Home">
        <svg viewBox="0 0 16 16">
          <path d="M2.5 7.5L8 3l5.5 4.5M4 6.5V13h3v-3h2v3h3V6.5" />
        </svg>
      </button>
      <form id="address-form">
        <button
          id="site-badge"
          type="button"
          title="View site information"
          aria-label="View site information"
        ></button>
        <input
          id="address"
          type="text"
          spellcheck="false"
          autocomplete="off"
          placeholder="Search or type a URL"
          aria-label="Address and search bar"
        />
        <button
          id="zoom-badge"
          type="button"
          title="Reset zoom"
          hidden
        ></button>
      </form>
      <button
        id="downloads"
        class="icon"
        title="Downloads (Ctrl+J)"
        aria-label="Downloads"
        hidden
      >
        <svg viewBox="0 0 16 16">
          <path d="M8 2.5v8M4.5 7L8 10.5 11.5 7M3 13.5h10" />
        </svg>
        <span id="downloads-count"></span>
      </button>
      <button
        id="menu"
        class="icon"
        title="Customize and control Qt Browser"
        aria-label="Menu"
      >
        <svg viewBox="0 0 16 16">
          <circle cx="8" cy="3.5" r="1.2" />
          <circle cx="8" cy="8" r="1.2" />
          <circle cx="8" cy="12.5" r="1.2" />
        </svg>
      </button>
    </nav>

    <div id="toast" role="status" hidden></div>
    <script src="chrome.js"></script>
  </body>
</html>
