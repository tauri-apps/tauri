<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Settings</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="pages.css" />
  </head>
  <body>
    <main>
      <h1>Settings</h1>
      <form id="form">
        <section>
          <h2>Search engine</h2>
          <div class="row">
            <label for="searchEngine">Used in the address bar</label>
            <select id="searchEngine">
              <option value="duckduckgo">DuckDuckGo</option>
              <option value="google">Google</option>
              <option value="bing">Bing</option>
              <option value="brave">Brave Search</option>
            </select>
          </div>
        </section>
        <section>
          <h2>On startup and new windows</h2>
          <div class="row">
            <label for="homepage"
              >Home page<small>Empty for the new tab page</small></label
            >
            <input
              id="homepage"
              type="text"
              placeholder="https://example.com"
            />
          </div>
          <div class="row">
            <label for="showHomeButton">Show home button</label>
            <input id="showHomeButton" type="checkbox" />
          </div>
          <div class="row">
            <label for="autostart"
              >Open at login<small>autostart plugin</small></label
            >
            <input id="autostart" type="checkbox" />
          </div>
        </section>
        <section>
          <h2>Appearance</h2>
          <div class="row">
            <label for="theme"
              >Theme<small>Also the native menus (app theme)</small></label
            >
            <select id="theme">
              <option value="system">System</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </div>
          <div class="row">
            <label for="defaultZoom"
              >Page zoom<small>For new tabs</small></label
            >
            <select id="defaultZoom">
              <option value="0.75">75%</option>
              <option value="0.9">90%</option>
              <option value="1">100%</option>
              <option value="1.1">110%</option>
              <option value="1.25">125%</option>
              <option value="1.5">150%</option>
            </select>
          </div>
          <div class="row">
            <label for="userAgent"
              >Identify as<small
                >Shared by all tabs, from their next load (Qt WebEngine after a
                restart). Google sign-in refuses embedded engines</small
              ></label
            >
            <select id="userAgent">
              <option value="chrome">Chrome</option>
              <option value="firefox">Firefox</option>
              <option value="engine">Qt WebEngine (engine default)</option>
            </select>
          </div>
          <div class="row">
            <label for="showMenuBar"
              >Show menu bar<small
                >The app menu (also View &gt; Show Menu Bar)</small
              ></label
            >
            <input id="showMenuBar" type="checkbox" />
          </div>
        </section>
        <section>
          <h2>System</h2>
          <div class="row">
            <label for="keepInTray"
              >Keep running in the tray<small
                >When the last window closes</small
              ></label
            >
            <input id="keepInTray" type="checkbox" />
          </div>
          <div class="row">
            <label for="notifications"
              >Notifications<small>When a download finishes</small></label
            >
            <input id="notifications" type="checkbox" />
          </div>
          <div class="row">
            <label for="globalShortcut"
              >Ctrl+Alt+B shows and hides the browser<small
                >System-wide (not on Wayland)</small
              ></label
            >
            <input id="globalShortcut" type="checkbox" />
          </div>
          <div class="row">
            <label for="confirmClose"
              >Ask before closing a window with several tabs</label
            >
            <input id="confirmClose" type="checkbox" />
          </div>
        </section>
        <section>
          <h2>Downloads</h2>
          <div class="row">
            <span
              >Location<small id="downloadDirLabel"
                >The system's downloads folder</small
              ></span
            >
            <span>
              <button id="resetDownloadDir" class="button" type="button" hidden>
                Default
              </button>
              <button id="changeDownloadDir" class="button" type="button">
                Change…
              </button>
            </span>
          </div>
        </section>
        <section>
          <h2>Privacy</h2>
          <div class="row">
            <span
              >Clear cookies, cache and site data<small
                >For every site</small
              ></span
            >
            <button id="clear" class="button" type="button">Clear data</button>
          </div>
        </section>
      </form>
      <p id="saved"></p>
    </main>
    <script src="settings.js"></script>
  </body>
</html>
