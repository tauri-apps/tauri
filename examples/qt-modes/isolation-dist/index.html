<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>isolation</title>
  </head>
  <body>
    <!-- Inline on purpose: Tauri allows it through a CSP hash, which must survive the runtime. -->
    <script>
      // Every IPC message passes here before it's encrypted; mark `echo` calls so Rust can tell
      // the message really went through the isolation iframe.
      window.__TAURI_ISOLATION_HOOK__ = (data) => {
        if (
          data.cmd === 'echo'
          && data.payload
          && typeof data.payload === 'object'
        ) {
          data.payload.isolated = true
        }
        return data
      }
    </script>
  </body>
</html>
