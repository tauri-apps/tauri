[package]
name = "qt-modes"
version = "0.1.0"
description = "Runs one set of IPC checks under each Tauri mode (patterns, asset origins, IPC transports) on the Qt runtime"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
publish = false

[build-dependencies]
tauri-build = { workspace = true, default-features = true, features = ["isolation"] }

[dependencies]
tauri = { workspace = true, default-features = true, features = ["isolation"] }
tauri-runtime-qt = { workspace = true }
serde_json = "1"
env_logger = "0.11"
