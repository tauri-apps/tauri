packages:
  - packages/api
  - packages/api-e2e
  - packages/cli
  - crates/tauri-schema-worker
  - examples/api
  - examples/resources
  - examples/file-associations

allowBuilds:
  # appium's postinstall only auto-installs drivers for global installs; ours
  # are regular devDependencies of packages/api-e2e, which appium picks up on
  # its own, so there is nothing for it to do
  appium: false
  # transitive deps of @wdio/utils; their postinstall downloads browser drivers
  # the Tauri suite never uses (it drives the app via tauri-driver)
  edgedriver: false
  esbuild: true
  geckodriver: false
  sharp: true
  workerd: true

overrides:
  axios@<1.20.0: ^1.20.0
  basic-ftp@<=6.2.0: ^6.2.1
  morgan@<1.12.0: ^1.12.0
  serialize-javascript@<7.0.5: ^7.0.5
  sharp@<0.35.5: ^0.35.5
  shell-quote@>=1.8.4 <1.11.0: ^1.11.0
  undici@>=7.0.0 <7.29.1: ^7.29.1

auditConfig:
  ignoreGhsas:
    # extract-zip symlink path traversal; no patched release exists (latest is
    # still 2.0.1). Reached via @wdio/utils > @puppeteer/browsers, which only
    # unpacks the browser drivers we never download (see allowBuilds above)
    - GHSA-jmr9-qjv8-65gv
    - GHSA-7pqw-9j4j-h8q3
    # braces, no fix available yet
    - GHSA-vfj7-8cjw-p6xm
