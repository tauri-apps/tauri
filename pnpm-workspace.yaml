packages:
  - packages/api
  - packages/api-e2e
  - packages/cli
  - crates/tauri-schema-worker
  - examples/api
  - examples/resources
  - examples/file-associations

allowBuilds:
  # transitive deps of @wdio/utils; their postinstall downloads browser drivers
  # the Tauri suite never uses (it drives the app via tauri-driver)
  edgedriver: false
  esbuild: true
  geckodriver: false
  sharp: true
  workerd: true

overrides:
  esbuild@>=0.27.3 <0.28.1: '>=0.28.1'
  ws@>=8.0.0 <8.20.1: '>=8.20.1'
