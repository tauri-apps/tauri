packages:
  - packages/api
  - packages/api-e2e
  - packages/cli
  - crates/tauri-schema-worker
  - examples/api
  - examples/resources
  - examples/file-associations

allowBuilds:
  # appium's postinstall only auto-installs drivers for global installs; ours
  # are regular devDependencies of packages/api-e2e, which appium picks up on
  # its own, so there is nothing for it to do
  appium: false
  # transitive deps of @wdio/utils; their postinstall downloads browser drivers
  # the Tauri suite never uses (it drives the app via tauri-driver)
  edgedriver: false
  esbuild: true
  geckodriver: false
  sharp: true
  workerd: true

overrides:
  axios@<1.20.0: ^1.20.0
  body-parser@>=2.0.0 <2.4.0: ^2.4.0
  glob@>=9.0.0 <=14.0.1: ^14.0.2
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  morgan@<1.12.0: ^1.12.0
  sharp@<0.35.5: ^0.35.5
  shell-quote@>=1.8.4 <1.11.0: ^1.11.0
  undici@>=7.0.0 <7.30.1: ^8.0.0

audit:
  ignore:
    # deepmerge, pulled in by @sveltejs/vite-plugin-svelte, no fix available yet
    - GHSA-gcqx-w48m-w2h4
    # picomatch ReDoS, pulled in by vite, doesn't affect us since only used in dev server, no fix available yet
    - GHSA-fc5q-39xc-vjpf

minimumReleaseAgeExclude:
  - appium-uiautomator2-driver@9.2.2
  - appium-xcuitest-driver@13.1.3
