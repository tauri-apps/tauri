packages:
  - packages/api
  - packages/cli
  - crates/tauri-schema-worker
  - examples/api
  - examples/resources
  - examples/file-associations

minimumReleaseAge: 10080
blockExoticSubdeps: true
trustPolicy: no-downgrade

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

overrides:
  esbuild@>=0.27.3 <0.28.1: '>=0.28.1'
  undici@>=7.0.0 <7.29.0: ^7.29.0
  ws@>=8.0.0 <8.20.1: '>=8.20.1'
