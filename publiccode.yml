# Applications built with Tauri render their UI with the webview provided by the
# operating system, so the runtime dependency depends on the target platform.
dependsOn:
  open:
    - name: Rust toolchain
      versionMin: '1.90'
    - name: WebKitGTK (Linux)
      versionMin: '2.40'
    - name: Node.js (JavaScript CLI and API packages)
      optional: true
  proprietary:
    - name: Microsoft Edge WebView2 Runtime (Windows)
    - name: Apple WKWebView (macOS and iOS)
    - name: Android System WebView (Android)
    - name: Xcode (macOS and iOS builds)
      optional: true
    - name: Android SDK and NDK (Android builds)
      optional: true
