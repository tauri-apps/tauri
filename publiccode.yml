description:
  en:
    shortDescription: >-
      Framework for building small, fast and secure desktop and mobile
      applications with a web frontend and a Rust backend.
    longDescription: >
      Tauri is a framework for building tiny, fast binaries for all major
      desktop and mobile operating systems. Developers can integrate any
      frontend framework that compiles to HTML, JavaScript and CSS to build
      their user interface, while the application backend is a Rust binary
      exposing an API the frontend can interact with.


      Instead of shipping a bundled browser engine, Tauri renders the user
      interface with the webview provided by the operating system (WKWebView
      on macOS and iOS, WebView2 on Windows, WebKitGTK on Linux and the
      Android System WebView on Android). This keeps applications small and
      lets them benefit from platform security updates. A capability-based
      permission system controls which native APIs the frontend may access.


      Tauri ships with a command line tool that scaffolds, develops, builds
      and bundles applications into native installers, and with an ecosystem
      of official plugins that provide access to native functionality such as
      the file system, notifications, dialogs and automatic updates.
    documentation: 'https://tauri.app'
    apiDocumentation: 'https://docs.rs/tauri'
    features:
      - Cross-platform desktop and mobile applications from a single codebase
      - Uses the operating system webview instead of a bundled browser engine
      - Capability-based permission system for native API access
      - Built-in bundler for .app, .dmg, .deb, .rpm, AppImage, NSIS and MSI
      - Built-in self updater for desktop applications
      - System tray icons, native menus and notifications
      - Custom protocol serving of web assets without a localhost server
      - Plugin system with official plugins for common native features

